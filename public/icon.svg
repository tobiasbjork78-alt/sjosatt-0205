<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Bakgrund med gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="diceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Bakgrund -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bgGradient)"/>

  <!-- Tärning 1 -->
  <rect x="120" y="150" width="120" height="120" rx="15" ry="15" fill="url(#diceGradient)" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Tärning 2 -->
  <rect x="272" y="150" width="120" height="120" rx="15" ry="15" fill="url(#diceGradient)" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Tärning 3 -->
  <rect x="120" y="302" width="120" height="120" rx="15" ry="15" fill="url(#diceGradient)" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Tärning 4 -->
  <rect x="272" y="302" width="120" height="120" rx="15" ry="15" fill="url(#diceGradient)" stroke="#e2e8f0" stroke-width="3"/>

  <!-- Prickar på tärning 1 (3 prickar i diagonal) -->
  <circle cx="140" cy="170" r="8" fill="#374151"/>
  <circle cx="180" cy="210" r="8" fill="#374151"/>
  <circle cx="220" cy="250" r="8" fill="#374151"/>

  <!-- Prickar på tärning 2 (4 prickar i hörnen) -->
  <circle cx="292" cy="170" r="8" fill="#374151"/>
  <circle cx="372" cy="170" r="8" fill="#374151"/>
  <circle cx="292" cy="250" r="8" fill="#374151"/>
  <circle cx="372" cy="250" r="8" fill="#374151"/>

  <!-- Prickar på tärning 3 (5 prickar) -->
  <circle cx="140" cy="322" r="8" fill="#374151"/>
  <circle cx="220" cy="322" r="8" fill="#374151"/>
  <circle cx="140" cy="402" r="8" fill="#374151"/>
  <circle cx="220" cy="402" r="8" fill="#374151"/>
  <circle cx="180" cy="362" r="8" fill="#374151"/>

  <!-- Prickar på tärning 4 (6 prickar) -->
  <circle cx="292" cy="322" r="8" fill="#374151"/>
  <circle cx="332" cy="322" r="8" fill="#374151"/>
  <circle cx="372" cy="322" r="8" fill="#374151"/>
  <circle cx="292" cy="402" r="8" fill="#374151"/>
  <circle cx="332" cy="402" r="8" fill="#374151"/>
  <circle cx="372" cy="402" r="8" fill="#374151"/>

  <!-- Text -->
  <text x="256" y="80" font-family="system-ui, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="white">YATSY</text>
  <text x="256" y="480" font-family="system-ui, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="white">Digital Protokoll</text>
</svg>